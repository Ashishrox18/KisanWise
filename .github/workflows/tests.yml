name: CI — Tests & Type-Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: Backend (Jest 90 tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: TypeScript type-check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run Jest test suite
        # External services (Gemini, Firestore, BigQuery, Agmarknet) are all
        # mocked — no credentials needed in CI.
        env:
          NODE_ENV: test
          GEMINI_API_KEY: ''          # disabled — fallback mode used in tests
          USE_LOCAL_STORAGE: 'true'   # avoids Firestore init
          JWT_SECRET: ci-test-secret-only
        run: npm test -- --forceExit --no-coverage

  frontend-typecheck:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit
